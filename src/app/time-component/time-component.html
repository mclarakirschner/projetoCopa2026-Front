<div class="container footer-spacer">

    <div class="row">
        <div class="col-12 text-center">
            <h2 class="title-times">
                <span class="title-icon"><i class="bi bi-shield-shaded"></i></span>
                Times da Copa
            </h2>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="form-card">
                <form [formGroup]="formGroupTime">

                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome</label>
                        <input placeholder="Insira o nome do time..." formControlName="nome" type="text"
                            class="form-control glass-input" id="nome">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="grupo">Grupo</label>
                        <input placeholder="Ex: A, B, C..." formControlName="grupo" type="text"
                            class="form-control glass-input" id="grupo">
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="pontos">Pontos</label>
                        <input formControlName="pontos" type="text" class="form-control" id="pontos">
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn-premium-primary" (click)="save()">
                            {{ idEditando ? 'Atualizar' : 'Salvar' }}
                        </button>
                    </div>

                </form>
            </div>

            <p class="text-muted"
                style="font-size: 0.95rem; letter-spacing: 1px; padding-bottom: 0; margin-top: -20px; padding-left: 10px;">
                Total de times registrados: <strong style="color: var(--accent-neon);">{{ times().length }}</strong>
            </p>
        </div>

        <div class="col-lg-7">
            <div class="table-responsive-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Grupo</th>
                            <th scope="col">Pontos</th>
                            <th scope="col" class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let t of times()">
                            <td>
                                <div class="team-cell">
                                    <span class="status-dot"></span>
                                    <strong class="team-name">{{t.nome}}</strong>
                                </div>
                            </td>
                            <td><span class="badge-group">{{t.grupo}}</span></td>
                            <td><span class="points-display">{{t.pontos}} <small>PTS</small></span></td>
                            <td class="text-end">
                                <button class="btn-action-edit" (click)="edit(t)" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </button>

                                <button class="btn-action-delete" (click)="delete(t)" title="Remover">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h3 class="mural-title">
                    <i class="bi bi-images"></i> Mural da Copa 2026
                </h3>
                <div class="divider"></div>
            </div>
        </div>

        <div class="row g-4 mt-4">
            <div class="col-12 col-md-4">
                <div class="card-gallery">
                    <img src="fotos/brasil.webp" alt="Imagem 1" class="img-fluid">
                    <div class="card-body-gallery">
                        <h5>BRASIL</h5>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card-gallery">
                    <img src="fotos/argentina.webp" alt="Imagem 2" class="img-fluid">
                    <div class="card-body-gallery">
                        <h5>ARGENTINA</h5>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card-gallery">
                    <img src="fotos/espanha.jpg" alt="Imagem 3" class="img-fluid">
                    <div class="card-body-gallery">
                        <h5>ESPANHA</h5>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card-gallery">
                    <img src="fotos/franca.webp" alt="Imagem 4" class="img-fluid">
                    <div class="card-body-gallery">
                        <h5>FRANÇA</h5>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card-gallery">
                    <img src="fotos/inglaterra.webp" alt="Imagem 5" class="img-fluid">
                    <div class="card-body-gallery">
                        <h5>INGLATERRA</h5>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card-gallery">
                    <img src="fotos/portugal.webp" alt="Imagem 6" class="img-fluid">
                    <div class="card-body-gallery">
                        <h5>PORTUGAL</h5>
                    </div>
                </div>
            </div>
        </div>



    </div>
