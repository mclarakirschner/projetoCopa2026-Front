<h2 class="mb-4 text-center">⚽ Cadastro de Partidas da Copa 2026</h2>

<form [formGroup]="formGroupPartida">

    <div class="mb-3">
        <label for="timeCasa">Time Casa</label>
        <input formControlName="timeCasa" type="text" class="form-control" id="timeCasa">
    </div>

    <div class="mb-3">
        <label for="timeVisitante">Time Visitante</label>
        <input formControlName="timeVisitante" type="text" class="form-control" id="timeVisitante">
    </div>

    <div class="mb-3">
        <label for="golsCasa">Gols Casa</label>
        <input formControlName="golsCasa" type="number" class="form-control" id="golsCasa">
    </div>

    <div class="mb-3">
        <label for="golsVisitante">Gols Visitante</label>
        <input formControlName="golsVisitante" type="number" class="form-control" id="golsVisitante">
    </div>

    <button type="button" class="btn btn-primary" (click)="save()">
        Salvar
    </button>

</form>


<table class="table table-striped mt-4">
    <thead>
        <tr>
            <th>Time Casa</th>
            <th>Placar</th>
            <th>Time Visitante</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let p of partidas()">
            <td>{{ p.timeCasa }}</td>
            <td>{{ p.golsCasa }} x {{ p.golsVisitante }}</td>
            <td>{{ p.timeVisitante }}</td>
        </tr>
    </tbody>
</table>
