<div class="container mt-4">

  <h2 class="text-center mb-4"> Cadastro de Partidas</h2>

  <div class="card p-3 mb-4 shadow-sm">

    <h5 class="mb-3">
      {{ idEditando ? 'Editar Partida' : 'Nova Partida' }}
    </h5>

    <form [formGroup]="formGroupPartida">

      <div class="row">

        <div class="col-md-3">
          <label class="form-label">Time Casa</label>
          <select class="form-select" formControlName="timeCasaId">
            <option value="">Selecione</option>
            <option *ngFor="let t of times" [value]="t.id">
              {{ t.nome }}
            </option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label">Gols Casa</label>
          <input type="number" min="0" class="form-control" formControlName="golsCasa">
        </div>

        <div class="col-md-1 d-flex align-items-end justify-content-center">
          <h4>X</h4>
        </div>

        <div class="col-md-2">
          <label class="form-label">Gols Visitante</label>
          <input type="number" min="0" class="form-control" formControlName="golsVisitante">
        </div>

        <div class="col-md-3">
          <label class="form-label">Time Visitante</label>
          <select class="form-select" formControlName="timeVisitanteId">
            <option value="">Selecione</option>
            <option *ngFor="let t of times" [value]="t.id">
              {{ t.nome }}
            </option>
          </select>
        </div>

      </div>

      <div class="mt-3 text-end">
        <button type="button" class="btn btn-primary" (click)="save()">
          {{ idEditando ? 'Atualizar Partida' : 'Salvar Partida' }}
        </button>
      </div>

    </form>
  </div>

  <div class="card shadow-sm p-3">

    <h5 class="mb-3">Lista de Partidas</h5>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Time Casa</th>
          <th>Placar</th>
          <th>Time Visitante</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let p of partidas()">

          <td>
            {{ p.timeCasaNome }}
          </td>

          <td>
            {{ p.golsCasa }} x {{ p.golsVisitante }}
          </td>

          <td>
            {{ p.timeVisitanteNome }}
          </td>

          <td>
            <button class="btn btn-warning me-2" (click)="edit(p)">
              Editar
            </button>

            <button class="btn btn-danger" (click)="delete(p)">
              Excluir
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>
