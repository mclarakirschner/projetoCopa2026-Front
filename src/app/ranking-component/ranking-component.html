<div class="container mt-4">

  <h2 class="text-center mb-4">
    🏆 Ranking da Copa 2026
  </h2>

  <table class="table table-striped table-bordered text-center">

    <thead class="table-dark">
      <tr>
        <th>Posição</th>
        <th>Time</th>
        <th>Grupo</th>
        <th>Pontos</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let t of times(); let i = index">

        <td>
          <span *ngIf="i == 0">🥇</span>
          <span *ngIf="i == 1">🥈</span>
          <span *ngIf="i == 2">🥉</span>
          <span *ngIf="i > 2">{{ i + 1 }}</span>
        </td>

        <td>{{ t.nome }}</td>
        <td>{{ t.grupo }}</td>
        <td><strong>{{ t.pontos }}</strong></td>

      </tr>

    </tbody>

  </table>

</div>
