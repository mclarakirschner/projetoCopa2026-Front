<div class="container mt-5">
  <h2 class="text-center mb-4 title-times">
    <span class="title-icon"><i class="bi bi-bar-chart-line"></i></span>
    Ranking da Copa 2026
  </h2>

  <div class="ranking-card">
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Posição</th>
            <th>Seleção</th>
            <th>Grupo</th>
            <th>Pontos</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of times(); let i = index">
            <td class="pos-cell">
              <i *ngIf="i == 0" class="bi bi-trophy-fill medal-gold"></i>
              <i *ngIf="i == 1" class="bi bi-award-fill medal-silver"></i>
              <i *ngIf="i == 2" class="bi bi-award-fill medal-bronze"></i>
              <span *ngIf="i > 2" class="num-pos">{{ i + 1 }}º</span>
            </td>
            <td class="time-cell"><strong>{{ t.nome }}</strong></td>
            <td class="group-cell">Grupo {{ t.grupo }}</td>
            <td class="points-col">{{ t.pontos }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
